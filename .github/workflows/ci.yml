name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - working-directory: backend
        run: ./mvnw -B verify
      # Forward-only kind-reclassification chain over a V7-era fixture.
      # The class is *IT-named, which Maven's default surefire/failsafe
      # naming never picks up, so it must be requested explicitly (H2 in
      # PostgreSQL mode - no service needed).
      - working-directory: backend
        run: ./mvnw -B test -Dtest=TransactionKindMigrationIT

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 20 is EOL; 24 is the active LTS (Next 16 needs >= 20.9).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      # The palette is enforced, not hoped for: default Tailwind hues and raw
      # hex literals in app/components fail the build.
      - working-directory: frontend
        run: npm run check:tokens
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install chromium
      # smoke.spec.ts runs backend-less; a11y + banking need the full stack (banking-e2e job).
      # E2E_BACKENDLESS tells the global-setup preflight there is no backend/database to
      # identify for this job.
      - working-directory: frontend
        run: npx playwright test smoke.spec.ts
        env:
          E2E_BACKENDLESS: "1"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose config --quiet

  concurrency-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankdb
          POSTGRES_USER: bankapp
          POSTGRES_PASSWORD: ci-secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bankapp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # The atomicity proof against the real database: parallel opposite-direction
      # transfers and idempotent replays must conserve money exactly. The datasource
      # overrides beat the test profile's H2 because system properties outrank YAML.
      - working-directory: backend
        run: >-
          ./mvnw -B test -Dtest=TransferConcurrencyIT
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/bankdb
          -Dspring.datasource.username=bankapp
          -Dspring.datasource.password=ci-secret
          -Dspring.datasource.driver-class-name=org.postgresql.Driver

  # Migration gate on real PostgreSQL: migrate a FRESH database to V21,
  # seed realistic pre-journal accounts + legacy transaction rows, then migrate
  # to head. V22 must book exactly one reconciling OPENING_BALANCE entry per
  # non-zero account against MIGRATION_OPENING, preserve every legacy row, and
  # V23 must establish loan principal. Needs its own job-scoped database - it
  # never shares a schema another test has written to.
  cutover-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankdb
          POSTGRES_USER: bankapp
          POSTGRES_PASSWORD: ci-secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bankapp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - working-directory: backend
        run: >-
          ./mvnw -B test -Dtest=JournalCutoverIT
          -Dit.pg.url=jdbc:postgresql://localhost:5432/bankdb
          -Dit.pg.user=bankapp
          -Dit.pg.password=ci-secret

  # Journal guarantees that only PostgreSQL can prove (H2's weaker locking
  # hides them): append-only BEFORE UPDATE/DELETE triggers reject even the app
  # role, the (kind, operation_ref) unique constraint refuses a duplicate
  # journal for one operation, a corrupted balance projection surfaces in the
  # operator reconciliation and is never auto-repaired, and a HELD approval
  # journals exactly one entry. Job-scoped fresh database, same command shape
  # the disposable local runs use.
  journal-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankdb
          POSTGRES_USER: bankapp
          POSTGRES_PASSWORD: ci-secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bankapp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - working-directory: backend
        run: >-
          ./mvnw -B test -Dtest=JournalReconciliationIT
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/bankdb
          -Dspring.datasource.username=bankapp
          -Dspring.datasource.password=ci-secret
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dit.pg.url=jdbc:postgresql://localhost:5432/bankdb
          -Dit.pg.user=bankapp
          -Dit.pg.password=ci-secret

  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankdb
          POSTGRES_USER: bankapp
          POSTGRES_PASSWORD: ci-secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bankapp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - working-directory: backend
        run: ./mvnw -B -DskipTests package
      - working-directory: backend
        run: PG_PASSWORD=ci-secret JWT_SECRET=ci-jwt-secret-0123456789abcdef-0123456789abcdef java -jar target/platform-*.jar & echo $! > app.pid
      - run: for i in $(seq 1 36); do curl -sf http://localhost:8080/api/health && break || sleep 5; done
      - working-directory: backend
        run: curl -sf http://localhost:8080/v3/api-docs -o /tmp/openapi-generated.json
      - working-directory: backend
        run: kill $(cat app.pid)
        if: always()
      # springdoc serializes reflected bean properties in JVM-dependent order, so a
      # byte diff flaps between environments for identical contracts. Compare
      # canonically: deep-equal after sorting every object's keys.
      - run: |
          node -e '
            const fs = require("fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const canon = (x) =>
              Array.isArray(x) ? x.map(canon)
              : x && typeof x === "object"
              ? Object.fromEntries(Object.keys(x).sort().map((k) => [k, canon(x[k])]))
              : x;
            const committed = canon(read("frontend/openapi.json"));
            const generated = canon(read("/tmp/openapi-generated.json"));
            if (JSON.stringify(committed) !== JSON.stringify(generated)) {
              console.error("OpenAPI contract drifted from the backend - regenerate frontend/openapi.json (npm run openapi after curling /v3/api-docs).");
              process.exit(1);
            }
            console.log("OpenAPI contract matches (order-insensitive).");
          '


  banking-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bankdb
          POSTGRES_USER: bankapp
          POSTGRES_PASSWORD: ci-secret
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bankapp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          # Node 20 is EOL; 24 is the active LTS (Next 16 needs >= 20.9).
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: ./mvnw -B -DskipTests package
      # APP_JWT_ACCESS_SECONDS=3 shrinks access tokens to seconds so the whole
      # browser suite runs past real expiries: every spec's authed calls must
      # silently refresh + retry (session.spec.ts waits out the TTL on purpose;
      # the other specs would fail outright if silent refresh were broken).
      # E2E_MARKER is the RUN-SPECIFIC identity the playwright global-setup
      # preflight demands: the same value must reach the backend boot and
      # the Playwright step below, so a leftover/stale server is refused
      # before the first seed instead of silently receiving the suite's data.
      - name: Boot backend with the run marker
        working-directory: backend
        run: PG_PASSWORD=ci-secret JWT_SECRET=ci-jwt-secret-0123456789abcdef-0123456789abcdef APP_JWT_ACCESS_SECONDS=3 java -jar target/platform-*.jar & echo $! > app.pid
        env:
          E2E_MARKER: e2e-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for backend health
        run: for i in $(seq 1 36); do curl -sf http://localhost:8080/api/health && break || sleep 5; done
      - run: for i in $(seq 1 36); do curl -sf http://localhost:8080/api/health && break || sleep 5; done
      # Seed the two demo users the a11y specs log in with (idempotent on re-run).
      - run: |
          for u in alice bob; do
            curl -sf -X POST http://localhost:8080/api/v1/auth/register \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$u@bank.local\",\"password\":\"secret123\",\"fullName\":\"$u seed\"}" || true
          done
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install chromium
      - working-directory: frontend
        run: E2E_ACCESS_TTL_SECONDS=3 npx playwright test
        env:
          E2E_MARKER: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_EXPECT_DB: bankdb
      - name: Stop backend
        working-directory: backend
        run: kill $(cat app.pid)
        if: always()
