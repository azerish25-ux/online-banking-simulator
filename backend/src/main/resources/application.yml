server:
  shutdown: graceful
  port: 8080
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: bank-platform
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/bankdb}
    username: ${PG_USER:bankapp}
    password: ${PG_PASSWORD:bankapp_secret_change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-0123456789abcdef-0123456789abcdef-0123456789abcdef}
    access-minutes: 15
    # E2E-only override (defaults 0 = off): when > 0 it wins over
    # access-minutes so the browser suite can prove silent refresh across a
    # real expiry in seconds instead of waiting 15 minutes.
    access-seconds: ${APP_JWT_ACCESS_SECONDS:0}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@bank.local}
    password: ${APP_ADMIN_PASSWORD:change-me-admin-123}
  auth:
    rate-limit:
      per-minute: ${AUTH_RATE_LIMIT:20}
      # Forwarding headers (X-Forwarded-For) are honored ONLY when the direct
      # socket peer falls inside this CIDR allowlist. Empty = never
      # trust them: the bucket key is the socket address, so spoofed headers
      # cannot mint fresh buckets. The compose deployment sets this to the
      # frontend network AFTER its sanitizing edge is verified.
      trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    refresh-days: ${AUTH_REFRESH_DAYS:7}
  # TOTP secret custody. Empty = legacy plaintext (local demo only).
  # Production deployments MUST set APP_TOTP_MASTER_KEY; DeploymentEnvGuard
  # refuses to start in production mode without a non-default key.
  totp:
    master-key: ${APP_TOTP_MASTER_KEY:}
  cookie:
    secure: ${COOKIE_SECURE:false}
  deposit:
    max-amount: ${DEPOSIT_MAX:100000}
  interest:
    savings-annual-rate: ${SAVINGS_RATE:0.04}
    loan-annual-rate: ${LOAN_RATE:0.12}
  cache:
    # Typed binding consumed by LedgerCacheConfig. The old nested
    # `caffeine.spec` string lived under the wrong namespace; Spring's cache
    # auto-configuration never read it, so these caches actually ran unbounded
    # and without expiry. LedgerCacheConfig builds the CaffeineCacheManager
    # from these values and CachePolicyTest inspects the live policy.
    maximum-size: 2000
    expire-after-write: 5m
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # /actuator/health is public; never leak DB/disk details to anonymous
      # callers. The app's own /api/health is the canonical liveness probe.
      show-details: never
info:
  app:
    name: Online Banking Simulator
    version: 1.3.0
