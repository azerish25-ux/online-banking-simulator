spring:
  datasource:
    url: jdbc:h2:mem:banktest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt:
    secret: test-only-secret-0123456789abcdef-0123456789abcdef-0123456789abcdef-00
    access-minutes: 15
  admin:
    email: admin-test@bank.local
    password: admin-test-123
  auth:
    rate-limit:
      per-minute: 1000
  notifications:
    outbox:
      # Tests drive the worker explicitly (deliverDue); a 5s poll would race
      # assertions about PENDING/DELIVERING rows.
      delivery-enabled: false
