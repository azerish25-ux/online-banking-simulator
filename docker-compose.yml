# Production-like full stack (CI builds this; local dev stays Docker-free - see start-all.ps1).
services:
  db:
    image: postgres:16-alpine
    container_name: bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bankapp
      POSTGRES_PASSWORD: ${PG_PASSWORD:-bankapp_secret_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankapp -d bankdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PG_URL: jdbc:postgresql://db:5432/bankdb
      PG_USER: bankapp
      PG_PASSWORD: ${PG_PASSWORD:-bankapp_secret_change_me}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef-0123456789abcdef}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-change-me-admin-123}
      # Auth rate-limit buckets must key on the real client IP, not the proxy's
      # own address. This is safe ONLY because the API is reachable exclusively
      # through the Next.js rewrite proxy (no backend host port is published)
      # and Next stamps X-Forwarded-For from the socket peer, replacing any
      # client-supplied value (vercel/next.js#57397). If an upstream proxy or
      # load balancer is ever added in front of Next, revisit this flag: the
      # added hop must sanitize X-Forwarded-For before it reaches the backend.
      TRUST_PROXY_HEADERS: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
