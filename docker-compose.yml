services:
  db:
    image: postgres:16-alpine
    container_name: bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bankdb
      POSTGRES_USER: bankapp
      POSTGRES_PASSWORD: bankapp_secret_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankapp -d bankdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full-stack run targets (wired in Part 7):
  # backend:
  #   build: ./backend
  #   ports: ["8080:8080"]
  #   depends_on: [db]
  # frontend:
  #   build: ./frontend
  #   ports: ["3000:3000"]
  #   depends_on: [backend]

volumes:
  postgres-data:
